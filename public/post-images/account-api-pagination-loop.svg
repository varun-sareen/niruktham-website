<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <rect width="720" height="440" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#fafafa">Account API — pagination loop</text>

  <!-- Step 1: Initial call -->
  <rect x="240" y="60" width="240" height="50" rx="6" fill="none" stroke="#d4a574" stroke-width="1.5"/>
  <text x="360" y="82" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#fafafa">GET /api/now/account</text>
  <text x="360" y="99" text-anchor="middle" font-family="Inter, monospace" font-size="10" fill="#a0a0a0">sysparm_limit=N  sysparm_offset=0</text>

  <!-- Arrow down to response -->
  <line x1="360" y1="110" x2="360" y2="140" stroke="#d4a574" stroke-width="1.5"/>
  <polygon points="355,140 360,150 365,140" fill="#d4a574"/>

  <!-- Step 2: Check response -->
  <rect x="240" y="152" width="240" height="40" rx="6" fill="none" stroke="#8ab068" stroke-width="1.5"/>
  <text x="360" y="170" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#fafafa">Process result array</text>
  <text x="360" y="184" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#a0a0a0">store / transform / forward records</text>

  <!-- Arrow down to diamond -->
  <line x1="360" y1="192" x2="360" y2="222" stroke="#d4a574" stroke-width="1.5"/>
  <polygon points="355,222 360,232 365,222" fill="#d4a574"/>

  <!-- Decision diamond: hasMore? -->
  <polygon points="360,232 430,270 360,308 290,270" fill="none" stroke="#d4a574" stroke-width="1.5"/>
  <text x="360" y="266" text-anchor="middle" font-family="Inter, monospace" font-size="12" font-weight="500" fill="#fafafa">hasMore</text>
  <text x="360" y="280" text-anchor="middle" font-family="Inter, monospace" font-size="12" font-weight="500" fill="#fafafa">== true?</text>

  <!-- YES path: right then up (loop back) -->
  <line x1="430" y1="270" x2="540" y2="270" stroke="#8ab068" stroke-width="1.5"/>
  <text x="480" y="262" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#8ab068">yes</text>

  <!-- Increment box on right -->
  <rect x="540" y="248" width="150" height="44" rx="6" fill="none" stroke="#8ab068" stroke-width="1.5"/>
  <text x="615" y="266" text-anchor="middle" font-family="Inter, monospace" font-size="10" fill="#fafafa">offset += limit</text>
  <text x="615" y="282" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#a0a0a0">call again with new offset</text>

  <!-- Arrow from increment box up to top -->
  <line x1="615" y1="248" x2="615" y2="85" stroke="#8ab068" stroke-width="1.5"/>
  <line x1="615" y1="85" x2="482" y2="85" stroke="#8ab068" stroke-width="1.5"/>
  <polygon points="482,80 470,85 482,90" fill="#8ab068"/>

  <!-- NO path: down to done -->
  <line x1="360" y1="308" x2="360" y2="340" stroke="#a0604a" stroke-width="1.5"/>
  <text x="375" y="328" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#a0604a">no</text>
  <polygon points="355,340 360,350 365,340" fill="#a0604a"/>

  <!-- Done box -->
  <rect x="290" y="352" width="140" height="36" rx="6" fill="none" stroke="#a0604a" stroke-width="1.5"/>
  <text x="360" y="374" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#fafafa">Done</text>

  <!-- Warning callout at bottom-left -->
  <rect x="30" y="330" width="230" height="80" rx="6" fill="none" stroke="#a0604a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="45" y="350" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#a0604a">Gotcha</text>
  <text x="45" y="367" font-family="Inter, sans-serif" font-size="10" fill="#a0a0a0">Default sysparm_limit = 10</text>
  <text x="45" y="382" font-family="Inter, sans-serif" font-size="10" fill="#a0a0a0">Forget to set it explicitly and</text>
  <text x="45" y="397" font-family="Inter, sans-serif" font-size="10" fill="#fafafa">you silently get 10 records back.</text>

  <!-- Iteration counter hint on right side -->
  <rect x="540" y="330" width="150" height="64" rx="6" fill="none" stroke="#a0a0a0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="555" y="350" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#a0a0a0">Example</text>
  <text x="555" y="367" font-family="Inter, sans-serif" font-size="10" fill="#a0a0a0">150 accounts, limit=50</text>
  <text x="555" y="382" font-family="Inter, sans-serif" font-size="10" fill="#fafafa">3 calls: offset 0, 50, 100</text>
</svg>
